<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园活动管理系统 V2.0</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="page">
        <h1>校园活动管理系统 V2.0</h1>
        <p>当前阶段已完成用户认证基础功能。</p>
        <nav class="actions">
            {% if session.get("user_id") %}
                <a class="button" href="{{ url_for('dashboard') }}">进入基础页面</a>
                <a class="button secondary" href="{{ url_for('logout') }}">登出</a>
            {% else %}
                <a class="button" href="{{ url_for('login') }}">登录</a>
                <a class="button secondary" href="{{ url_for('register') }}">学生注册</a>
            {% endif %}
        </nav>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="message {{ category }}">{{ message }}</p>
            {% endfor %}
        {% endwith %}
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
